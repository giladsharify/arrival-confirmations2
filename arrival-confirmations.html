<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הזמנה לברית המילה</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6ef;
    --bg-card:#ffffff;
    --ink:#2c2620;
    --ink-soft:#6b6055;
    --gold:#b6912c;
    --gold-soft:#e8d9ad;
    --green:#3f7a5a;
    --green-bg:#e7f3ec;
    --red:#a4463a;
    --red-bg:#f7eae8;
    --line:#e8e0d1;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1914;
      --bg-card:#26221c;
      --ink:#f2ece0;
      --ink-soft:#b8ac98;
      --gold:#d9b658;
      --gold-soft:#4a3f26;
      --green:#7fd1a6;
      --green-bg:#20332a;
      --red:#e19489;
      --red-bg:#3a2521;
      --line:#3a3327;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1914;
    --bg-card:#26221c;
    --ink:#f2ece0;
    --ink-soft:#b8ac98;
    --gold:#d9b658;
    --gold-soft:#4a3f26;
    --green:#7fd1a6;
    --green-bg:#20332a;
    --red:#e19489;
    --red-bg:#3a2521;
    --line:#3a3327;
  }
  html,body{height:100%;}
  * { box-sizing: border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Heebo', sans-serif;
    min-height:100%;
    display:flex;
    justify-content:center;
    padding:28px 16px 48px;
  }
  .wrap{ width:100%; max-width:560px; }
  .card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:34px 26px;
    box-shadow:0 10px 30px rgba(0,0,0,0.06);
  }
  .ornament{ text-align:center; color:var(--gold); font-size:22px; letter-spacing:8px; margin-bottom:10px; }
  h1{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:700;
    text-align:center;
    font-size:22px;
    line-height:1.6;
    margin:0 0 22px;
    color:var(--ink);
  }
  .blessing{
    text-align:center;
    font-size:16px;
    line-height:1.9;
    color:var(--ink-soft);
    margin-bottom:20px;
  }
  .baby-name{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:900;
    text-align:center;
    font-size:32px;
    color:var(--gold);
    margin: 6px 0 22px;
  }
  .divider{
    display:flex; align-items:center; gap:10px;
    margin:22px 0;
    color:var(--gold);
  }
  .divider::before, .divider::after{
    content:""; flex:1; height:1px; background:var(--line);
  }
  .details{
    text-align:center;
    font-size:17px;
    line-height:2;
    margin-bottom:22px;
  }
  .details b{ font-weight:700; }
  .signature{
    text-align:center;
    font-family:'Frank Ruhl Libre', serif;
    font-size:19px;
    font-weight:700;
    color:var(--ink);
    margin-top:8px;
  }
  .signature small{
    display:block;
    font-family:'Heebo', sans-serif;
    font-weight:400;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:4px;
  }

  .invite-img{
    display:block;
    width:100%;
    border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);
    margin-bottom:6px;
  }
  form{ margin-top:28px; }
  label{ display:block; font-size:14px; font-weight:500; color:var(--ink-soft); margin:0 0 8px; }
  input[type="text"], textarea{
    width:100%;
    font-family:inherit;
    font-size:16px;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    margin-bottom:18px;
    resize:vertical;
  }
  textarea{ min-height:70px; }
  input[type="text"]:focus, textarea:focus{ outline:2px solid var(--gold-soft); border-color:var(--gold); }

  .choice-row{ display:flex; gap:12px; margin-bottom:20px; }
  .choice{
    flex:1;
    padding:16px 10px;
    text-align:center;
    border-radius:12px;
    border:2px solid var(--line);
    background:var(--bg);
    cursor:pointer;
    font-size:16px;
    font-weight:700;
    color:var(--ink-soft);
    transition:all .15s ease;
    user-select:none;
  }
  .choice.yes.selected{ border-color:var(--green); background:var(--green-bg); color:var(--green); }
  .choice.no.selected{ border-color:var(--red); background:var(--red-bg); color:var(--red); }

  button.submit{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:var(--gold);
    color:#fff;
    font-size:17px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    transition:opacity .15s;
  }
  button.submit:disabled{ opacity:.5; cursor:default; }
  .err{ color:var(--red); font-size:13px; margin:-10px 0 14px; display:none; }

  .thankyou{ text-align:center; padding:20px 0; }
  .thankyou .icon{ font-size:44px; margin-bottom:14px; }
  .thankyou h2{ font-family:'Frank Ruhl Libre', serif; font-size:22px; margin:0 0 8px; }
  .thankyou p{ color:var(--ink-soft); font-size:15px; line-height:1.7; }
  .edit-link{ display:inline-block; margin-top:16px; font-size:14px; color:var(--gold); cursor:pointer; text-decoration:underline; background:none; border:none; font-family:inherit; }

  /* Admin dashboard */
  .admin-toggle{
    max-width:560px; width:100%;
    display:flex; justify-content:center; gap:8px;
    margin-bottom:14px;
  }
  .admin-toggle button{
    font-family:inherit; font-size:13px; padding:8px 16px; border-radius:20px;
    border:1px solid var(--line); background:var(--bg-card); color:var(--ink-soft); cursor:pointer;
  }
  .admin-toggle button.active{ background:var(--gold); color:#fff; border-color:var(--gold); }

  .stats-row{ display:flex; gap:12px; margin-bottom:22px; }
  .stat{ flex:1; text-align:center; padding:18px 8px; border-radius:14px; }
  .stat .num{ font-family:'Frank Ruhl Libre', serif; font-size:30px; font-weight:900; }
  .stat .lbl{ font-size:13px; margin-top:4px; color:var(--ink-soft); }
  .stat.yes{ background:var(--green-bg); } .stat.yes .num{ color:var(--green); }
  .stat.no{ background:var(--red-bg); } .stat.no .num{ color:var(--red); }
  .stat.total{ background:var(--gold-soft); } .stat.total .num{ color:var(--gold); }

  .resp-list{ display:flex; flex-direction:column; gap:10px; }
  .resp{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:14px 14px; border-radius:12px; border:1px solid var(--line);
  }
  .resp.yes{ border-inline-start:4px solid var(--green); }
  .resp.no{ border-inline-start:4px solid var(--red); }
  .resp .name{ font-weight:700; font-size:15px; }
  .resp .note{ font-size:13px; color:var(--ink-soft); margin-top:4px; line-height:1.5; }
  .resp .badge{ font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .resp.yes .badge{ background:var(--green-bg); color:var(--green); }
  .resp.no .badge{ background:var(--red-bg); color:var(--red); }
  .empty{ text-align:center; color:var(--ink-soft); font-size:14px; padding:30px 0; }
</style>
</head>

    <form id="rsvpForm">
      <label for="nameInput">שם מלא</label>
      <input type="text" id="nameInput" placeholder="הקלידו את שמכם" autocomplete="name">

      <label>האם תגיעו?</label>
      <div class="choice-row">
        <div class="choice yes" data-val="yes">מגיע/ה בשמחה 🎉</div>
        <div class="choice no" data-val="no">לא אוכל להגיע</div>
      </div>
      <div class="err" id="errMsg">נא למלא שם ולבחור אפשרות</div>

      <label for="notesInput">הערות מיוחדות (לא חובה)</label>
      <textarea id="notesInput" placeholder="כשרות, נגישות, מספר משתתפים וכו׳"></textarea>

      <button type="submit" class="submit" id="submitBtn">שליחת אישור</button>
    </form>

    <div class="thankyou" id="thankyou" style="display:none;">
      <div class="icon" id="tyIcon">🎉</div>
      <h2 id="tyTitle">תודה על התגובה!</h2>
      <p id="tyText">האישור נשלח בהצלחה.</p>
      <button class="edit-link" id="editLink">שינוי התשובה</button>
    </div>
  </div>

  <div class="card" id="dashCard" style="display:none;">
    <h1 style="margin-bottom:4px;">ניהול אישורי הגעה</h1>
    <div style="text-align:center; color:var(--ink-soft); font-size:14px; margin-bottom:22px;">ברית המילה — 29.09.2026</div>

    <div class="stats-row">
      <div class="stat yes"><div class="num" id="countYes">0</div><div class="lbl">מגיעים</div></div>
      <div class="stat no"><div class="num" id="countNo">0</div><div class="lbl">לא מגיעים</div></div>
      <div class="stat total"><div class="num" id="countTotal">0</div><div class="lbl">סה״כ הגיבו</div></div>
    </div>

    <div class="resp-list" id="respList">
      <div class="emply empty">עדיין לא התקבלו תגובות</div>
    </div>
  </div>

</div>

<script>
let db = null;
let user = null;
let isOwner = false;
let selected = null;
let myDocId = null;

const STORE_KEY = 'brit_rsvp_my_doc_id';

function uid(){
  return 'r_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,9);
}

function setSelected(val){
  selected = val;
  document.querySelectorAll('.choice').forEach(el=>{
    el.classList.toggle('selected', el.dataset.val === val);
  });
  document.getElementById('errMsg').style.display = 'none';
}

document.querySelectorAll('.choice').forEach(el=>{
  el.addEventListener('click', ()=> setSelected(el.dataset.val));
});

function showThankYou(status){
  document.getElementById('rsvpForm').style.display = 'none';
  document.getElementById('thankyou').style.display = 'block';
  if(status === 'yes'){
    document.getElementById('tyIcon').textContent = '🎉';
    document.getElementById('tyTitle').textContent = 'איזה כיף, מחכים לראותכם!';
    document.getElementById('tyText').textContent = 'תודה שאישרתם הגעה.';
  } else {
    document.getElementById('tyIcon').textContent = '💛';
    document.getElementById('tyTitle').textContent = 'תודה על העדכון';
    document.getElementById('tyText').textContent = 'חבל שלא תוכלו להגיע, נחשוב עליכם.';
  }
}

function showForm(){
  document.getElementById('rsvpForm').style.display = 'block';
  document.getElementById('thankyou').style.display = 'none';
}

document.getElementById('editLink').addEventListener('click', showForm);

document.getElementById('rsvpForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const name = document.getElementById('nameInput').value.trim();
  const notes = document.getElementById('notesInput').value.trim();

  if(!name || !selected){
    document.getElementById('errMsg').style.display = 'block';
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'שולח...';

  try{
    if(db){
      const id = myDocId || uid();
      await db.doc('rsvps/' + id).set({
        name, status: selected, notes, ts: Date.now()
      });
      myDocId = id;
      try{ localStorage.setItem(STORE_KEY, id); }catch(err){}
    }
    showThankYou(selected);
  }catch(err){
    document.getElementById('errMsg').textContent = 'אירעה שגיאה בשליחה, נסו שוב';
    document.getElementById('errMsg').style.display = 'block';
  }finally{
    btn.disabled = false;
    btn.textContent = 'שליחת אישור';
  }
});

function renderDashboard(docs){
  const list = document.getElementById('respList');
  let yes = 0, no = 0;
  const items = [];
  docs.forEach(d=>{
    if(d.status === 'yes') yes++; else no++;
    items.push(d);
  });
  items.sort((a,b)=> (b.ts||0) - (a.ts||0));

  document.getElementById('countYes').textContent = yes;
  document.getElementById('countNo').textContent = no;
  document.getElementById('countTotal').textContent = yes + no;

  if(items.length === 0){
    list.innerHTML = '<div class="empty">עדיין לא התקבלו תגובות</div>';
    return;
  }

  list.innerHTML = items.map(d=>{
    const safeName = (d.name||'ללא שם').replace(/</g,'&lt;');
    const safeNote = (d.notes||'').replace(/</g,'&lt;');
    return `<div class="resp ${d.status}">
      <div>
        <div class="name">${safeName}</div>
        ${safeNote ? `<div class="note">${safeNote}</div>` : ''}
      </div>
      <div class="badge">${d.status === 'yes' ? 'מגיע/ה' : 'לא מגיע/ה'}</div>
    </div>`;
  }).join('');
}

document.getElementById('btnFormView').addEventListener('click', ()=>{
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('dashCard').style.display = 'none';
  document.getElementById('btnFormView').classList.add('active');
  document.getElementById('btnDashView').classList.remove('active');
});
document.getElementById('btnDashView').addEventListener('click', ()=>{
  document.getElementById('formCard').style.display = 'none';
  document.getElementById('dashCard').style.display = 'block';
  document.getElementById('btnFormView').classList.remove('active');
  document.getElementById('btnDashView').classList.add('active');
});

async function init(){
  try{
    const saved = localStorage.getItem(STORE_KEY);
    if(saved) myDocId = saved;
  }catch(err){}

  try{
    db = await claude.use('db');
  }catch(err){ db = null; }

  try{
    user = await claude.use('user');
    isOwner = !!(user && user.isOwner && user.isOwner());
  }catch(err){ isOwner = false; }

  if(isOwner){
    document.getElementById('adminToggle').style.display = 'flex';
  }

  // If this viewer already submitted on this device, show their existing answer
  if(db && myDocId){
    try{
      const existing = await db.doc('rsvps/' + myDocId).get();
      if(existing && existing.name){
        document.getElementById('nameInput').value = existing.name;
        document.getElementById('notesInput').value = existing.notes || '';
        setSelected(existing.status);
        showThankYou(existing.status);
      }
    }catch(err){ /* no existing doc, ignore */ }
  }

  if(db){
    try{
      db.collection('rsvps').onSnapshot((docs)=>{
        renderDashboard(docs || []);
      });
    }catch(err){ /* live updates unavailable */ }
  }
}

init();
</script>
